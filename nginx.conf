server {
    server_name artix.itsash.in;

    root /home/artixcapital/docs;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }

    location ^~ /_nuxt/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location ~* \.(?:svg|ico|png|jpe?g|webp|avif|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/artix.itsash.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/artix.itsash.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = artix.itsash.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name artix.itsash.in;
    listen 80;
    return 404; # managed by Certbot


}
